<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Missing Shadow – Storyboard (Sketch)</title>
    <link rel="icon" href="images/TITLE.png">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #fff;
      --sf: #f8f9fa;
      --ln: #dadce0;
      --tx: #3c4043;
      --hd: #202124;
      --mu: #70757a;
      --ac: #1a73e8;
      --ach: #e8f0fe;
      --sh: 0 1px 2px rgba(60, 64, 67, .3), 0 1px 3px 1px rgba(60, 64, 67, .15)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #202124;
        --sf: #2d2e31;
        --ln: #5f6368;
        --tx: #bdc1c6;
        --hd: #e8eaed;
        --mu: #9aa0a6;
        --ac: #8ab4f8;
        --ach: #394457;
        --sh: 0 1px 3px rgba(0, 0, 0, .6)
      }
    }

    :root[data-theme="dark"] {
      --bg: #202124;
      --sf: #2d2e31;
      --ln: #5f6368;
      --tx: #bdc1c6;
      --hd: #e8eaed;
      --mu: #9aa0a6;
      --ac: #8ab4f8;
      --ach: #394457;
      --sh: 0 1px 3px rgba(0, 0, 0, .6)
    }

    html {
      scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 400 14px/1.5 "Google Sans", Roboto, "Noto Sans Thai", system-ui, sans-serif
    }

    .bar {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 14px;
      height: 64px;
      padding: 0 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--ln)
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--ac);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      flex: none
    }

    .bar h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 400;
      color: var(--hd);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .bar h1 b {
      font-weight: 500
    }

    .sp {
      flex: 1
    }

    .pill {
      border: 1px solid var(--ln);
      border-radius: 20px;
      padding: 6px 16px;
      color: var(--hd);
      font-weight: 500;
      background: var(--bg);
      white-space: nowrap
    }

    .wrap {
      display: grid;
      grid-template-columns: 240px 1fr;
      max-width: 1280px;
      margin: 0 auto
    }

    aside {
      position: sticky;
      top: calc(env(safe-area-inset-top, 0px) + 64px);
      align-self: start;
      padding: 20px 16px;
      height: fit-content
    }

    .lbl {
      font-weight: 500;
      color: var(--hd);
      margin: 0 0 8px;
      font-size: 13px
    }

    .cal label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--hd)
    }

    .cal label:hover {
      background: var(--sf)
    }

    .cal input {
      width: 18px;
      height: 18px;
      margin: 0;
      flex: none
    }

    .pb {
      height: 6px;
      border-radius: 3px;
      background: var(--ln);
      overflow: hidden;
      margin: 6px 0
    }

    .pb i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--ac);
      transition: width .3s
    }

    #prog {
      color: var(--mu);
      font-size: 13px
    }

    main {
      padding: 12px 24px 56px;
      min-width: 0
    }

    .sec {
      margin-bottom: 28px
    }

    .sh {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0 14px;
      color: var(--hd);
      font-size: 18px;
      font-weight: 500
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--c)
    }

    .sh small {
      color: var(--mu);
      font-size: 13px;
      font-weight: 400
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
      gap: 16px
    }

    .card {
      background: var(--bg);
      border: 1px solid var(--ln);
      border-radius: 12px;
      overflow: hidden;
      transition: box-shadow .2s
    }

    .card:hover {
      box-shadow: var(--sh)
    }

    .slot {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      justify-content: center;
      aspect-ratio: 16/9;
      background: var(--sf);
      color: var(--mu);
      cursor: pointer;
      text-align: center
    }

    .slot:hover {
      background: var(--ach);
      color: var(--ac)
    }

    .slot.over {
      outline: 2px dashed var(--ac);
      outline-offset: -8px;
      background: var(--ach)
    }

    .slot .pl {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid currentColor;
      display: grid;
      place-items: center;
      font-size: 24px;
      line-height: 1
    }

    .slot img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .slot input {
      display: none
    }

    .x {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      border: 0;
      border-radius: 16px;
      background: rgba(32, 33, 36, .75);
      color: #fff;
      padding: 4px 12px;
      font: inherit;
      cursor: pointer
    }

    .info {
      padding: 12px 16px 16px;
      border-left: 4px solid var(--c)
    }

    .ev {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px
    }

    .chip {
      background: var(--c);
      color: var(--t);
      border-radius: 4px;
      padding: 2px 8px;
      font-weight: 500;
      font-size: 12px
    }

    .tm {
      color: var(--mu);
      font-size: 12px
    }

    .tech {
      color: var(--mu);
      font-size: 12px;
      margin-bottom: 6px
    }

    .dia {
      margin-top: 8px;
      padding: 6px 10px;
      background: var(--sf);
      border-radius: 8px;
      color: var(--hd)
    }

    @media(max-width:860px) {
      .wrap {
        display: block
      }

      aside {
        position: static;
        padding: 12px 16px 0
      }

      .cal {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px
      }

      main {
        padding: 8px 16px 48px
      }

      .bar {
        padding: 0 14px
      }

      .bar h1 {
        font-size: 18px
      }
    }

    .story {
      color: var(--mu);
      margin: -4px 0 14px;
      max-width: 820px
    }

    .box {
      border: 1px solid var(--ln);
      border-radius: 12px;
      padding: 4px 16px;
      margin: 12px 0 4px;
      background: var(--bg)
    }

    summary {
      cursor: pointer;
      color: var(--ac);
      font-weight: 500;
      padding: 8px 0
    }

    .meta {
      color: var(--mu);
      font-size: 12px;
      margin: 2px 0
    }

    .box ul {
      margin: 4px 0 12px;
      padding-left: 20px
    }

    .slot,
    .slot:hover {
      cursor: default;
      background: var(--sf);
      color: var(--mu)
    }

    .slot small {
      font-size: 11px;
      opacity: .8
    }

    .slot img {
      cursor: zoom-in
    }

    #lb {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0, 0, 0, .88);
      align-items: center;
      justify-content: center;
      padding: 16px;
      cursor: zoom-out
    }

    #lb img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px
    }

    /* ===== วิดีโอ ===== */
    .film {
      margin: 16px 0 28px
    }

    .film iframe,
    .card iframe {
      width: 100%;
      aspect-ratio: 16/9;
      border: 0;
      display: block;
      background: #000
    }

    .film iframe {
      border-radius: 12px
    }

    .verr {
      padding: 8px 12px;
      color: var(--mu);
      font-size: 12px
    }
  </style>
</head>

<body>
  <div class="bar">
    <div class="logo">M</div>
        <h1><b>The Missing Shadow (เงาที่หายไป) พิชามญช์ โภคะ</b> Storyboard</h1>
    <div class="sp"></div><span class="pill" id="tot"></span>
  </div>
  <div class="wrap">
    <aside>
      <div class="lbl">ซีน</div>
      <div class="cal" id="cal"></div>
      <div class="lbl" style="margin-top:20px">ความคืบหน้าของภาพ</div>
      <div class="pb"><i id="pbi"></i></div>
      <div id="prog"></div>
    </aside>
    <main id="m">
    </main>
  </div>
  <div id="lb" onclick="this.style.display='none'"><img alt=""></div>

    function mkVideo(link) {
