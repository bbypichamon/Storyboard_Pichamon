<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Missing Shadow – Storyboard (Sketch)</title>
  <link rel="icon" href="images/TITLE.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap">
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #fafafa; --sf: #f1f3f6; --cd: #fff; --ln: #e1e4ea; --tx: #3c4043; --hd: #16181d; --mu: #6b7280;
      --ac: #4f46e5; --ach: #eef0ff;
      --sh: 0 1px 2px rgba(20, 24, 40, .06), 0 8px 24px rgba(20, 24, 40, .08);
      --shh: 0 2px 4px rgba(20, 24, 40, .08), 0 16px 36px rgba(20, 24, 40, .16)
    }
    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #14151a; --sf: #1e2027; --cd: #1b1d24; --ln: #2f323c; --tx: #c4c8d0; --hd: #f1f2f5; --mu: #9aa0ad;
        --ac: #9aa4ff; --ach: #272b45; --sh: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .35); --shh: 0 16px 36px rgba(0, 0, 0, .6)
      }
    }
    :root[data-theme="dark"] {
      --bg: #14151a; --sf: #1e2027; --cd: #1b1d24; --ln: #2f323c; --tx: #c4c8d0; --hd: #f1f2f5; --mu: #9aa0ad;
      --ac: #9aa4ff; --ach: #272b45; --sh: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .35); --shh: 0 16px 36px rgba(0, 0, 0, .6)
    }
    html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px); scroll-behavior: smooth }
    * { box-sizing: border-box }
    body { margin: 0; background: var(--bg); color: var(--tx); font: 400 15px/1.6 "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif }

    .bar {
      position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 14px;
      height: 68px; padding: 0 24px; background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--ln)
    }
    .logo {
      width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #4f46e5, #ec4899); color: #fff;
      display: grid; place-items: center; font-weight: 700; flex: none
    }
    .logo { position: relative; overflow: hidden }
    .logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover }
    .bar h1 { margin: 0; font-size: 18px; font-weight: 400; color: var(--hd); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
    .bar h1 b { font-weight: 700 }
    .sp { flex: 1 }
    .pill { border-radius: 20px; padding: 6px 16px; color: var(--ac); font-weight: 500; background: var(--ach); white-space: nowrap; font-size: 13px }

    .wrap { display: grid; grid-template-columns: 250px 1fr; max-width: 1320px; margin: 0 auto }
    aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 68px); align-self: start; padding: 24px 16px; height: fit-content }
    .lbl { font-weight: 700; color: var(--mu); margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase }
    .cal label { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; cursor: pointer; color: var(--hd); font-size: 14px; transition: background .15s }
    .cal label:hover { background: var(--sf) }
    .cal input { width: 17px; height: 17px; margin: 0; flex: none }
    .pb { height: 8px; border-radius: 4px; background: var(--ln); overflow: hidden; margin: 8px 0 }
    .pb i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4f46e5, #ec4899); transition: width .4s }
    #prog { color: var(--mu); font-size: 13px }

    main { padding: 16px 28px 64px; min-width: 0 }
    .sec { margin-bottom: 40px }
    .sh { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 12px 0 8px; color: var(--hd); font-size: 20px; font-weight: 700 }
    .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c) }
    .sh small { color: var(--mu); font-size: 13px; font-weight: 400; background: var(--sf); border-radius: 12px; padding: 1px 10px }
    .story { color: var(--mu); margin: 0 0 16px; max-width: 820px }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 20px }
    .card {
      background: var(--cd); border: 1px solid var(--ln); border-radius: 16px; overflow: hidden; box-shadow: var(--sh);
      transition: transform .25s, box-shadow .25s; content-visibility: auto; contain-intrinsic-size: 340px 460px
    }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shh) }
    .slot {
      position: relative; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center;
      aspect-ratio: 16/9; background: linear-gradient(110deg, var(--sf) 30%, var(--ach) 50%, var(--sf) 70%) 0 0/200% 100%;
      color: var(--mu); text-align: center; animation: sk 1.6s linear infinite
    }
    .slot.ok { animation: none; background: var(--sf) }
    @keyframes sk { to { background-position: -200% 0 } }
    .slot .pl { width: 40px; height: 40px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-size: 24px; line-height: 1; opacity: .6 }
    .slot small { font-size: 11px; opacity: .8 }
    .slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; opacity: 0; transition: opacity .35s }
    .slot img.in { opacity: 1 }
    .info { padding: 14px 18px 18px; border-top: 3px solid var(--c) }
    .ev { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px }
    .chip { background: var(--c); color: var(--t); border-radius: 20px; padding: 2px 12px; font-weight: 700; font-size: 12px }
    .tm { color: var(--mu); font-size: 12px }
    .tech { color: var(--mu); font-size: 12px; margin-bottom: 6px }
    .dia { margin-top: 10px; padding: 8px 12px; background: var(--sf); border-radius: 10px; color: var(--hd); border-left: 3px solid var(--c) }
    details > summary { cursor: pointer; color: var(--ac); font-weight: 500; padding: 8px 0 }
    .meta { color: var(--mu); font-size: 12px; margin: 3px 0 }
    .box { border: 1px solid var(--ln); border-radius: 16px; padding: 4px 20px; margin: 4px 0 24px; background: var(--cd); box-shadow: var(--sh) }
    .box ul { margin: 4px 0 12px; padding-left: 20px }
    .box li { margin: 4px 0 }

    #lb { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .9); align-items: center; justify-content: center; padding: 16px; cursor: zoom-out }
    #lb img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px }

    .chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); gap: 20px; margin-top: 8px }
    .chars .slot { aspect-ratio: 3/2; background: #fff; animation: none }
    .chars .slot img { object-fit: contain }
    .chars .info b { display: block; color: var(--hd); font-size: 16px; margin-bottom: 2px }
    .chars .info p { margin: 4px 0 0 }

    .vid { max-width: 900px }
    .vframe { position: relative; aspect-ratio: 16/9; border-radius: 20px; overflow: hidden; background: radial-gradient(circle at 30% 20%, #3a3f52, #15161c 70%); box-shadow: var(--shh) }
    .vframe iframe, .vframe .poster { position: absolute; inset: 0; width: 100%; height: 100%; border: 0 }
    .vframe .poster { object-fit: cover; opacity: .85 }
    .vplay { position: absolute; inset: 0; width: 100%; border: 0; padding: 0; background: linear-gradient(to top, rgba(0, 0, 0, .55), rgba(0, 0, 0, .05) 55%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #fff; cursor: pointer; font: inherit }
    .vplay i { width: 76px; height: 76px; border-radius: 50%; background: rgba(255, 255, 255, .18); border: 2px solid #fff; backdrop-filter: blur(4px); display: grid; place-items: center; transition: transform .2s, background .2s }
    .vplay i::after { content: ""; margin-left: 6px; border-style: solid; border-width: 14px 0 14px 24px; border-color: transparent transparent transparent #fff }
    .vplay:hover i { transform: scale(1.08); background: rgba(255, 255, 255, .3) }
    .vplay span { font-weight: 500; text-shadow: 0 1px 4px rgba(0, 0, 0, .6) }
    .vbadge { position: absolute; top: 12px; left: 12px; z-index: 2; background: rgba(32, 33, 36, .75); color: #fff; border-radius: 16px; padding: 3px 12px; font-size: 12px; font-weight: 500 }
    .vmeta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 12px }
    .vmeta p { margin: 0; color: var(--mu); flex: 1; min-width: 200px }
    .vbtn { border: 1px solid var(--ln); border-radius: 20px; padding: 6px 16px; color: var(--ac); font-weight: 500; text-decoration: none; background: var(--cd); white-space: nowrap }
    .vbtn:hover { background: var(--ach) }
    .vempty { font-size: 13px; opacity: .8; text-align: center; padding: 0 16px }

    @media(max-width:860px) {
      .wrap { display: block }
      aside { position: static; padding: 12px 16px 0 }
      .cal { display: flex; flex-wrap: wrap; gap: 4px 8px }
      main { padding: 8px 16px 48px }
      .bar { padding: 0 14px }
      .bar h1 { font-size: 15px }
    }
    @media (prefers-reduced-motion:reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important } }
  </style>
</head>

<body>
  <div class="bar">
    <div class="logo"><span>M</span><img src="images/TITLE.png" alt="The Missing Shadow" decoding="async" fetchpriority="high" onload="this.parentNode.style.background='#fff';this.previousElementSibling.style.display='none'" onerror="this.remove()"></div>
    <h1><b>The Missing Shadow (เงาที่หายไป) พิชามญช์ โภคะ</b> Storyboard</h1>
    <div class="sp"></div><span class="pill" id="tot"></span>
  </div>
  <div class="wrap">
    <aside>
      <div class="lbl">ซีน</div>
      <div class="cal" id="cal"></div>
      <div class="lbl" style="margin-top:20px">ภาพที่โหลดแล้ว</div>
      <div class="pb"><i id="pbi"></i></div>
      <div id="prog"></div>
    </aside>
    <main id="m">
      <div class="box" id="intro"></div>
      <section class="sec vid" id="video" style="--c:#f4511e">
        <div class="sh"><span class="dot"></span>วิดีโอตัวอย่าง<small>30 วินาที · YouTube</small></div>
        <div class="vframe" id="vframe"></div>
        <div class="vmeta"><p id="vdesc"></p><a class="vbtn" id="vlink" target="_blank" rel="noopener" style="display:none">เปิดใน YouTube ↗</a></div>
      </section>
      <section class="sec" id="chars" style="--c:#1a73e8">
        <div class="sh"><span class="dot"></span>ตัวละครหลัก<small>4 ตัว</small></div>
        <div class="chars" id="charGrid"></div>
      </section>
    </main>
  </div>
  <div id="lb" onclick="this.style.display='none'"><img alt=""></div>
  <script>
    /* วางรูปไว้ในโฟลเดอร์ images/ ตั้งชื่อ SH01.png ... SH22.png และ TITLE.png

    var HERO = "หวังลี่";

        f.insertAdjacentHTML("beforeend", '<div class="vplay" style="cursor:default"><i></i><span>รอวิดีโอตัวอย่าง</span><div class="vempty">ใส่ลิงก์ YouTube ที่ VIDEO.url ในไฟล์</div></div>');
        return;
      }
      var link = document.getElementById("vlink"); link.href = "https://www.youtube.com/watch?v=" + id; link.style.display = "";
      f.insertAdjacentHTML("beforeend", '<img class="poster" alt="" loading="lazy" decoding="async" src="https://img.youtube.com/vi/' + id + '/hqdefault.jpg">' +
        '<button class="vplay" aria-label="เล่นวิดีโอ"><i></i><span>' + raw(VIDEO.title) + '</span></button>');
      f.querySelector(".vplay").onclick = function () {
        f.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0&modestbranding=1" title="' + raw(VIDEO.title) + '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
      };
    })();
  </script>
</body>

</html>
